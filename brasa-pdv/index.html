<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171717">
<title>Brasa PDV | Demonstração</title>
<style>
:root{--bg:#f5f5f4;--ink:#191919;--muted:#737373;--line:#e7e5e4;--orange:#f97316;--green:#15803d;--red:#b91c1c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Arial,sans-serif}header{background:#171717;color:white;padding:18px max(16px,calc((100% - 1100px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}header strong{font-size:20px}header small{display:block;color:#bbb;margin-top:4px}main{max-width:1100px;margin:auto;padding:20px 14px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:18px}.tabs button{white-space:nowrap;border:1px solid var(--line);border-radius:9px;background:white;padding:11px 14px;font-weight:bold;cursor:pointer}.tabs button.active,.primary{background:var(--orange);border-color:var(--orange);color:white}.grid{display:grid;gap:13px}.stats{grid-template-columns:repeat(4,1fr);margin-bottom:15px}.card,.panel{background:white;border:1px solid var(--line);border-radius:13px;padding:16px}.stat-label{color:var(--muted);font-size:12px}.stat-value{font-size:23px;font-weight:bold;margin:10px 0}.muted{color:var(--muted);font-size:12px}.tables{grid-template-columns:repeat(4,1fr)}.table{border-top:4px solid #d4d4d4;display:flex;flex-direction:column;gap:9px}.table.occupied{border-top-color:var(--orange)}.table.pending{border-top-color:var(--red)}.table b{font-size:15px}.money{font-size:16px;font-weight:bold;margin-top:auto}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#f4f4f5;font-size:11px;width:max-content}.pill.orange{background:#ffedd5;color:#9a3412}.pill.green{background:#dcfce7;color:#166534}.pill.red{background:#fee2e2;color:#991b1b}button{cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:white;font-weight:bold}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--orange);border-color:var(--orange)}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.products{grid-template-columns:repeat(3,1fr)}.product{display:flex;flex-direction:column;gap:8px}.product h3{font-size:14px;margin:0}.price{color:#c2410c;font-weight:bold}.listrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.listrow:last-child{border-bottom:0}.listrow small{display:block;color:var(--muted);margin-top:4px}.empty{padding:24px;text-align:center;color:var(--muted)}.notice{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:12px;border-radius:9px;font-size:12px;line-height:1.5;margin-top:15px}.hide{display:none!important}.field{display:grid;gap:6px;margin:10px 0}.field label{font-size:12px;font-weight:bold}.field input,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font:14px Arial}.overlay{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:14px;z-index:5}.modal{background:white;border-radius:15px;padding:20px;width:min(600px,100%);max-height:90vh;overflow:auto}.modal h2{margin-top:0}.itemgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.itemgrid button{text-align:left;padding:12px}.itemgrid strong,.itemgrid small{display:block}.itemgrid small{color:#c2410c;margin-top:6px}.footer{color:#999;font-size:11px;margin-top:18px} @media(max-width:750px){.stats{grid-template-columns:repeat(2,1fr)}.tables{grid-template-columns:repeat(2,1fr)}.products{grid-template-columns:repeat(2,1fr)}header{align-items:flex-start}}@media(max-width:380px){.products{grid-template-columns:1fr}}
</style></head>
<body>
<header><div><strong>🔥 BRASA PDV</strong><small>Gestão do espetinho · Demonstração</small></div><div id="clock" class="muted" style="color:#ddd"></div></header>
<main><div class="tabs" id="tabs"><button class="active" data-page="home">▦ Visão geral</button><button data-page="tables">▤ Mesas</button><button data-page="kitchen">♨ Cozinha</button><button data-page="cash">▣ PDV / Caixa</button><button data-page="products">◇ Cardápio</button></div><div id="content"></div><div class="notice">DEMONSTRAÇÃO: os dados ficam salvos somente neste navegador. Não use para vendas reais. Para sincronizar celular e caixa, ainda é necessário conectar um banco de dados seguro.</div><div class="footer">Brasa PDV · Protótipo de demonstração · Valores e produtos fictícios</div></main>
<div id="modalRoot"></div>
<script>
const KEY='brasa_demo_public_v1';
const initialProducts=[['Carne','Espetinhos',10,'🍢'],['Frango','Espetinhos',8,'🍗'],['Linguiça','Espetinhos',8,'🌭'],['Pão de alho','Acompanhamentos',6,'🥖'],['Coca-Cola lata','Bebidas',6,'🥤'],['Água','Bebidas',3,'💧'],['Cerveja lata','Bebidas',7,'🥫'],['Refrigerante 2L','Bebidas',12,'🧃']];
function initial(){return {products:initialProducts.map((p,i)=>({id:'p'+i,name:p[0],category:p[1],price:p[2],emoji:p[3],stock:50,active:true})),tables:Array.from({length:12},(_,i)=>({id:i+1,name:'Mesa '+String(i+1).padStart(2,'0'),status:'free',customer:'',items:[],notes:''})),orders:[],sales:[],cash:false,expenses:[]}}
let db;try{db=JSON.parse(localStorage.getItem(KEY))||initial()}catch(e){db=initial()}
let page='home', selected=1, cart=[];
const $=s=>document.querySelector(s), brl=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}), total=items=>(items||[]).reduce((a,i)=>a+i.price*i.qty,0), esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function go(p){page=p;$('#tabs').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
function card(label,value,note){return '<div class="card"><div class="stat-label">'+label+'</div><div class="stat-value">'+value+'</div><div class="muted">'+note+'</div></div>'}
function tableCard(t){return '<div class="card table '+t.status+'"><b>'+t.name+'</b><span class="pill '+(t.status==='free'?'green':t.status==='pending'?'red':'orange')+'">'+({free:'Livre',occupied:'Ocupada',pending:'Pendente'})[t.status]+'</span><div class="muted">'+esc(t.customer||'Sem nome de cliente')+'</div><div class="money">'+brl(total(t.items))+'</div><div class="row"><button class="primary" onclick="openOrder('+t.id+')">'+(t.status==='free'?'Abrir mesa':'Pedido +')+'</button>'+(t.status!=='free'?'<button onclick="checkout('+t.id+')">Cobrar</button>':'')+'</div></div>'}
function render(){save();let c=$('#content'),occupied=db.tables.filter(t=>t.status!=='free').length,pending=db.tables.reduce((a,t)=>a+total(t.items),0),revenue=db.sales.reduce((a,s)=>a+s.total,0);
if(page==='home'){c.innerHTML='<div class="grid stats">'+card('Faturamento registrado',brl(revenue),db.sales.length+' venda(s) paga(s)')+card('Mesas ocupadas',occupied,(db.tables.length-occupied)+' livres')+card('Contas em aberto',brl(pending),'Aguardando pagamento')+card('Pedidos na cozinha',db.orders.filter(o=>!['delivered','cancelled'].includes(o.status)).length,'Novos ou em preparo')+'</div><div class="panel"><div class="row"><h2>Mapa de mesas</h2><button onclick="go(\'tables\')">Ver todas</button></div><div class="grid tables">'+db.tables.slice(0,8).map(tableCard).join('')+'</div></div><div class="panel"><h2>Últimas vendas</h2>'+(db.sales.length?db.sales.slice(-5).reverse().map(s=>'<div class="listrow"><span>'+esc(s.tableName)+' · '+esc(s.payment)+'<small>'+new Date(s.date).toLocaleString('pt-BR')+'</small></span><b>'+brl(s.total)+'</b></div>').join(''):'<div class="empty">As vendas de demonstração aparecerão aqui.</div>')+'</div>'}
if(page==='tables'){c.innerHTML='<div class="row" style="margin-bottom:14px"><div><h2>Mesas e comandas</h2><p class="muted">Selecione uma mesa para registrar consumo.</p></div><button onclick="newTable()">+ Nova mesa</button></div><div class="grid tables">'+db.tables.map(tableCard).join('')+'</div>'}
if(page==='kitchen'){let os=db.orders.filter(o=>!['delivered','cancelled'].includes(o.status)).slice().reverse();c.innerHTML='<div class="panel"><h2>Cozinha / churrasqueira</h2><p class="muted">Pedidos lançados nas comandas aparecem aqui.</p>'+(os.length?os.map(o=>'<div class="listrow"><div><b>'+esc(o.tableName)+' · '+esc(o.customer||'Cliente')+'</b><small>'+o.items.map(i=>i.qty+'× '+esc(i.name)).join(', ')+'</small><small>Status: '+({new:'Novo',preparing:'Em preparo',ready:'Pronto'})[o.status]+'</small></div><div class="row">'+(o.status==='new'?'<button class="primary" onclick="statusOrder(\''+o.id+'\',\'preparing\')">Preparar</button>':'')+(o.status==='preparing'?'<button class="primary" onclick="statusOrder(\''+o.id+'\',\'ready\')">Pronto</button>':'')+'<button onclick="statusOrder(\''+o.id+'\',\'delivered\')">Entregue</button></div></div>').join(''):'<div class="empty">Nenhum pedido na fila. Abra uma mesa e adicione itens.</div>')+'</div>'}
if(page==='cash'){c.innerHTML='<div class="panel"><div class="row"><div><h2>Caixa / PDV</h2><p class="muted">Contas abertas das mesas.</p></div><button class="'+(db.cash?'':'primary')+'" onclick="toggleCash()">'+(db.cash?'Fechar caixa':'Abrir caixa')+'</button></div>'+(db.cash?'':'<div class="notice">Abra o caixa para confirmar pagamentos nesta demonstração.</div>')+'<div style="overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr><th style="text-align:left;padding:10px">Mesa</th><th>Itens</th><th>Total</th><th></th></tr></thead><tbody>'+ (db.tables.filter(t=>t.status!=='free').map(t=>'<tr><td style="padding:10px;border-top:1px solid #eee">'+t.name+'<br><small>'+esc(t.customer)+'</small></td><td style="text-align:center">'+t.items.reduce((a,i)=>a+i.qty,0)+'</td><td style="text-align:center">'+brl(total(t.items))+'</td><td style="text-align:right"><button class="primary" onclick="checkout('+t.id+')">Receber</button></td></tr>').join('')||'<tr><td colspan="4" class="empty">Nenhuma conta em aberto.</td></tr>')+'</tbody></table></div></div><div class="panel"><h2>Vendas finalizadas</h2>'+(db.sales.length?db.sales.slice().reverse().map(s=>'<div class="listrow"><span>'+esc(s.tableName)+' · '+esc(s.payment)+'<small>'+new Date(s.date).toLocaleString('pt-BR')+'</small></span><b>'+brl(s.total)+'</b></div>').join(''):'<div class="empty">Nenhuma venda ainda.</div>')+'</div>'}
if(page==='products'){c.innerHTML='<div class="row" style="margin-bottom:14px"><div><h2>Cardápio</h2><p class="muted">Produtos e preços de exemplo.</p></div><button class="primary" onclick="addProduct()">+ Produto</button></div><div class="grid products">'+db.products.map(p=>'<div class="card product"><div style="font-size:26px">'+p.emoji+'</div><h3>'+esc(p.name)+'</h3><span class="pill">'+esc(p.category)+'</span><div class="price">'+brl(p.price)+'</div><small class="muted">Estoque de demonstração: '+p.stock+'</small><button onclick="editProduct(\''+p.id+'\')">Editar</button></div>').join('')+'</div>'}
}
function openModal(html){$('#modalRoot').innerHTML='<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">'+html+'</div></div>'}function closeModal(){$('#modalRoot').innerHTML=''}
function openOrder(id){selected=id;let t=db.tables.find(x=>x.id===id);cart=t.items.map(x=>({...x}));openModal('<div class="row"><h2>'+t.name+' · Comanda</h2><button onclick="closeModal()">✕</button></div><div class="field"><label>Nome do cliente</label><input id="cust" value="'+esc(t.customer)+'" placeholder="Nome (opcional)"></div><div class="field"><label>Observação</label><input id="notes" value="'+esc(t.notes)+'" placeholder="Ex.: sem cebola"></div><p class="muted">Adicionar produtos</p><div class="itemgrid">'+db.products.filter(p=>p.active).map(p=>'<button onclick="addCart(\''+p.id+'\')"><strong>'+p.emoji+' '+esc(p.name)+'</strong><small>'+brl(p.price)+'</small></button>').join('')+'</div><div id="cartList">'+cartHtml()+'</div><div class="row" style="margin-top:12px"><b>Total: <span id="cartTotal">'+brl(total(cart))+'</span></b><button class="primary" onclick="saveOrder()">Salvar pedido</button></div>')}
function cartHtml(){return cart.length?cart.map(i=>'<div class="listrow"><span>'+i.qty+'× '+esc(i.name)+'<small>'+brl(i.price)+' cada</small></span><span><button onclick="qty(\''+i.id+'\',-1)">−</button> '+i.qty+' <button onclick="qty(\''+i.id+'\',1)">+</button></span></div>').join(''):'<div class="empty">Adicione itens à comanda.</div>'}
function updateCart(){let el=$('#cartList');if(el)el.innerHTML=cartHtml();let t=$('#cartTotal');if(t)t.textContent=brl(total(cart))}
function addCart(id){let p=db.products.find(p=>p.id===id),i=cart.find(i=>i.id===id);if(i)i.qty++;else cart.push({id:p.id,name:p.name,price:p.price,qty:1});updateCart()}
function qty(id,n){let i=cart.find(i=>i.id===id);if(i)i.qty+=n;cart=cart.filter(i=>i.qty>0);updateCart()}
function saveOrder(){let t=db.tables.find(x=>x.id===selected);t.customer=$('#cust').value.trim();t.notes=$('#notes').value.trim();t.items=cart.map(i=>({...i}));t.status=t.items.length?'occupied':'free';if(t.items.length)db.orders.push({id:String(Date.now())+Math.random(),tableId:t.id,tableName:t.name,customer:t.customer,items:t.items.map(i=>({...i})),notes:t.notes,status:'new',date:new Date().toISOString()});save();closeModal();render();alert('Pedido salvo e enviado para a fila da cozinha!')}
function statusOrder(id,status){let o=db.orders.find(o=>o.id===id);if(o)o.status=status;save();render()}
function checkout(id){let t=db.tables.find(t=>t.id===id);if(!t.items.length)return alert('Mesa sem itens.');if(!db.cash)return alert('Abra o caixa antes de receber pagamentos.');openModal('<h2>Receber pagamento · '+t.name+'</h2><p>'+t.items.map(i=>i.qty+'× '+esc(i.name)).join('<br>')+'</p><h2>Total: '+brl(total(t.items))+'</h2><div class="field"><label>Forma de pagamento</label><select id="payment"><option>Pix</option><option>Dinheiro</option><option>Cartão de débito</option><option>Cartão de crédito</option></select></div><div class="row"><button onclick="closeModal()">Cancelar</button><button class="primary" onclick="pay('+id+')">Confirmar pagamento</button></div>')}
function pay(id){let t=db.tables.find(t=>t.id===id);db.sales.push({tableName:t.name,items:t.items.map(i=>({...i})),total:total(t.items),payment:$('#payment').value,date:new Date().toISOString()});t.items.forEach(i=>{let p=db.products.find(p=>p.id===i.id);if(p)p.stock=Math.max(0,p.stock-i.qty)});db.orders.filter(o=>o.tableId===id).forEach(o=>o.status='delivered');t.status='free';t.customer='';t.items=[];t.notes='';save();closeModal();render();alert('Pagamento registrado e mesa liberada.')}
function toggleCash(){db.cash=!db.cash;save();render()}
function newTable(){let id=Math.max(0,...db.tables.map(t=>t.id))+1;db.tables.push({id,name:'Mesa '+String(id).padStart(2,'0'),status:'free',customer:'',items:[],notes:''});render()}
function addProduct(){openModal('<h2>Novo produto</h2><div class="field"><label>Nome</label><input id="pn"></div><div class="field"><label>Preço (R$)</label><input id="pp" type="number" min=".01" step=".01"></div><div class="field"><label>Categoria</label><select id="pc"><option>Espetinhos</option><option>Bebidas</option><option>Acompanhamentos</option><option>Outros</option></select></div><div class="row"><button onclick="closeModal()">Cancelar</button><button class="primary" onclick="createProduct()">Salvar</button></div>')}
function createProduct(){let name=$('#pn').value.trim(),price=Number($('#pp').value);if(!name||price<=0)return alert('Informe nome e preço válido.');db.products.push({id:'p'+Date.now(),name,category:$('#pc').value,price,emoji:'🍢',stock:0,active:true});save();closeModal();render()}
function editProduct(id){let p=db.products.find(p=>p.id===id);openModal('<h2>Editar produto</h2><div class="field"><label>Nome</label><input id="pn" value="'+esc(p.name)+'"></div><div class="field"><label>Preço (R$)</label><input id="pp" type="number" min=".01" step=".01" value="'+p.price+'"></div><div class="row"><button onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveProduct(\''+id+'\')">Salvar</button></div>')}
function saveProduct(id){let p=db.products.find(p=>p.id===id),name=$('#pn').value.trim(),price=Number($('#pp').value);if(!name||price<=0)return alert('Confira nome e preço.');p.name=name;p.price=price;save();closeModal();render()}
$('#tabs').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});$('#clock').textContent=new Date().toLocaleDateString('pt-BR',{dateStyle:'full'});render();
</script></body></html>

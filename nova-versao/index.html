<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,Segoe UI,Arial,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 13px;background:var(--red);color:#fff;font-weight:700}button:hover{filter:brightness(1.1)}button.secondary{background:#2a2a31;color:#f4f4f5;border:1px solid #3b3b44}button.danger{background:#7e1822}button.small{padding:6px 9px;font-size:12px}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}.sidebar{background:#101013;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px}.brand{display:flex;gap:11px;align-items:center;padding:4px 8px 16px;border-bottom:1px solid var(--line)}.brandmark{width:42px;height:42px;border-radius:12px;background:linear-gradient(145deg,#ff3a4b,var(--red2));display:grid;place-items:center;font-size:22px;font-weight:900}.brand strong{display:block;font-size:15px;letter-spacing:.5px}.brand span{color:#ff6672;font-size:10px;letter-spacing:1.5px}.navgroup{color:#73737e;font-size:10px;font-weight:800;letter-spacing:1.4px;padding:5px 11px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{background:transparent;color:#bdbdc6;text-align:left;display:flex;align-items:center;gap:11px;font-weight:600;border:1px solid transparent;padding:11px 12px}.nav button.active{background:rgba(227,38,54,.15);color:white;border-color:rgba(227,38,54,.32)}.nav button.active .ico{color:#ff5a68}.ico{width:19px;text-align:center;font-size:17px}.sidefoot{margin-top:auto;color:#767680;font-size:11px;padding:12px 8px}.main{min-width:0}.topbar{height:74px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#101013;position:sticky;top:0;z-index:5}.topbar h2{font-size:19px;margin:0}.topbar p{margin:3px 0 0;color:var(--muted);font-size:12px}.topright{display:flex;gap:10px;align-items:center}.status{font-size:11px;color:var(--green);border:1px solid #24533e;background:#12271c;border-radius:30px;padding:7px 10px}.content{padding:26px;max-width:1600px;margin:auto}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}.pagehead h1{margin:0;font-size:25px;letter-spacing:-.4px}.pagehead p{margin:6px 0 0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;gap:15px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:18px;min-width:0}.statlabel{color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:8px}.statvalue{font-size:25px;font-weight:800;margin-top:12px;letter-spacing:-.5px}.statfoot{color:var(--muted);font-size:11px;margin-top:7px}.staticon{color:#ff5b69;background:rgba(227,38,54,.13);padding:8px;border-radius:9px}.twocol{grid-template-columns:1.25fr 1fr}.sectiontitle{font-size:15px;margin:0 0 14px}.muted{color:var(--muted)}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:11px}table{border-collapse:collapse;width:100%;min-width:650px}th,td{text-align:left;padding:12px 13px;border-bottom:1px solid #29292f;white-space:nowrap}th{font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:#9999a4;background:#1a1a1f}td{font-size:12px}tr:last-child td{border-bottom:0}.empty{text-align:center;color:var(--muted);padding:28px}.badge{font-size:10px;border-radius:20px;padding:5px 8px;background:#282830;color:#ddd}.badge.good{background:#153324;color:#66e2a3}.badge.warn{background:#3a2c13;color:#f7d078}.badge.bad{background:#421b21;color:#ff8992}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select{max-width:100%}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px;min-width:0}.field label{font-size:11px;color:#c4c4cd;font-weight:700}.field input,.field select,.field textarea,.toolbar input,.toolbar select{background:#101014;color:#fff;border:1px solid #383840;border-radius:9px;padding:11px 12px;outline:none;width:100%;min-width:0}.field input:focus,.field select:focus,.toolbar input:focus{border-color:var(--red)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 13px}.formgrid .full{grid-column:1/-1}.modalback{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modalback.show{display:flex}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:#17171c;border:1px solid #3a3a43;border-radius:16px;padding:22px;box-shadow:0 25px 100px #000}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h3{margin:0;font-size:18px}.close{background:#2a2a31;padding:6px 10px}.formactions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.poslayout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(320px,.8fr);gap:16px}.possearch{display:flex;gap:8px;margin-bottom:12px}.possearch input{flex:1;background:#101014;color:white;border:1px solid #383840;border-radius:9px;padding:12px;min-width:0}.productgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.producttile{background:#1d1d23;border:1px solid #33333c;border-radius:12px;padding:13px;text-align:left;color:white;min-height:105px;display:flex;flex-direction:column;justify-content:space-between;gap:8px}.producttile strong{font-size:12px}.producttile span{color:#ff6a76;font-size:14px;font-weight:800}.producttile small{color:var(--muted)}.cartline{display:grid;grid-template-columns:1fr auto;gap:6px;padding:12px 0;border-bottom:1px solid #2b2b32}.cartline:last-child{border-bottom:0}.cartline strong{font-size:12px}.cartline small{display:block;color:var(--muted);margin-top:3px}.qty{display:flex;align-items:center;gap:6px}.qty button{padding:4px 8px}.totalrow{display:flex;justify-content:space-between;align-items:center;margin-top:12px}.totalrow.big{font-size:21px;font-weight:900;border-top:1px solid var(--line);padding-top:15px}.alert{background:#302512;border:1px solid #5d461b;color:#f3d58c;padding:12px;border-radius:10px;margin-bottom:14px;font-size:12px}.hidden{display:none!important}.toast{position:fixed;bottom:20px;right:20px;z-index:50;background:#1b3225;border:1px solid #326548;color:#c7f6d8;padding:13px 17px;border-radius:10px;display:none;max-width:calc(100vw - 40px)}.toast.show{display:block}.pill{display:inline-flex;align-items:center;gap:6px}.redtext{color:#ff6672}.greentext{color:var(--green)}.chartbars{height:180px;display:flex;align-items:end;gap:12px;padding:12px 4px 0}.barcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:end;height:100%;gap:7px;min-width:0}.bar{width:min(34px,80%);min-height:3px;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,#ff5968,#b71928)}.barcol small{font-size:10px;color:var(--muted)}.barcol em{font-size:10px;font-style:normal;color:#ddd}.note{font-size:11px;color:var(--muted);line-height:1.5;margin-top:12px}.mobilemenu{display:none}
@media(max-width:1100px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.twocol{grid-template-columns:1fr}.productgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.content{padding:20px}}
@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{display:none;position:fixed;left:0;top:0;bottom:0;width:260px;z-index:30;box-shadow:20px 0 60px #0009}.sidebar.open{display:flex}.topbar{height:65px;padding:0 15px}.topbar h2{font-size:16px}.topright .status{display:none}.mobilemenu{display:inline-block;background:#24242a;padding:8px 10px;margin-right:8px}.topheading{display:flex;align-items:center}.content{padding:16px}.pagehead{flex-direction:column}.pagehead h1{font-size:22px}.stats{gap:10px}.card{padding:14px}.statvalue{font-size:21px}.poslayout{grid-template-columns:1fr}.productgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.formgrid{grid-template-columns:1fr}.formgrid .full{grid-column:auto}.poscart{order:-1}.actions{width:100%}.actions button{flex:1}.statlabel{font-size:11px}}
@media print{body{background:#fff;color:#000}.sidebar,.topbar,.pagehead,.no-print{display:none!important}.app{display:block}.content{padding:0}.card{background:#fff;color:#000;border:0}.tablewrap{border:1px solid #ddd}th,td{color:#000;border-color:#ddd}.printonly{display:block!important}}

.pdv-screen .pdv-purple{background:#56339a;border:1px solid #8058cb;border-radius:13px;padding:14px;margin-bottom:12px}
.pdv-screen .pdv-seller{background:#242a35;border:1px solid #414957;border-radius:13px;padding:14px;margin-bottom:12px}
.pdv-screen .pdv-orange{background:#a94f16;border:1px solid #e08335;border-radius:13px;padding:14px}

<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brandmark">D</div><div><strong>DISTRIBUIDORA REZENDE</strong><span>SISTEMA INTEGRADO</span></div></div>
  <div>
    <div class="navgroup">OPERAÇÃO</div>
    <nav class="nav">
      <button class="active" data-page="dashboard"><span class="ico">▦</span>Painel geral</button>
      <button data-page="pdv"><span class="ico">▣</span>Caixa / PDV</button>
      <button data-page="comandas"><span class="ico">☷</span>Comandas</button>
      <button data-page="products"><span class="ico">▤</span>Produtos e estoque</button>
      <button data-page="customers"><span class="ico">♙</span>Clientes</button>
      <button data-page="sales"><span class="ico">◷</span>Histórico de vendas</button>
    </nav>
  </div>
  <div>

    <nav class="nav">
      <button data-page="finance"><span class="ico">▥</span>Financeiro</button>

      <button data-page="expenses"><span class="ico">↘</span>Despesas</button>

  </div>
  <div class="sidefoot">Sistema integrado • sincronização configurável<br>Preto & vermelho • Distribuidora</div>
</aside>
<main class="main">
  <header class="topbar">
    <div class="topheading"><button class="mobilemenu" id="mobilemenu">☰</button><div><h2 id="topTitle">Painel geral</h2><p id="today"></p></div></div>
    <div class="topright"><span class="status" id="cloudStatus">● Dados locais</span><span class="status" id="networkStatus">● Online</span><button class="secondary" id="installAppBtn" style="display:none" onclick="installApp()">＋ Instalar app</button><button class="secondary" onclick="openCloudPanel()">☁ Sincronização</button><button onclick="openSaleHelp()">Ajuda do PDV</button></div>
  </header>
  <div class="content" id="content"></div>
</main>
</div>
<div class="modalback" id="modalback"><div class="modal"><div class="modalhead"><h3 id="modalTitle">Cadastro</h3><button class="close" onclick="closeModal()">✕</button></div><div id="modalbody"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const dateBR=d=>d?new Date(d+'T12:00:00').toLocaleDateString('pt-BR'):'—';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const defaultState={products:[],customers:[],sales:[],expenses:[],suppliers:[],receipts:[],comandas:[],cash:{date:today(),opening:0,closed:false,closing:null},settings:{businessName:'Distribuidora Rezende',lowStock:5}};
let state; try{state=JSON.parse(localStorage.getItem('distribuidoraProV2'))||structuredClone(defaultState)}catch(e){state=JSON.parse(JSON.stringify(defaultState))}
state.comandas ||= []; let currentPage='dashboard',cart=[],currentCustomer='',payMethod='Dinheiro',pdvDiscount=0;
function save(){localStorage.setItem('distribuidoraProV2',JSON.stringify(state));scheduleCloudSync()}
let cloudSyncTimer=null,cloudSyncBusy=false,cloudSyncAgain=false;
const cloudSyncMetaKey='rz_cloud_sync_meta';
function cloudStateSnapshot(){return JSON.stringify(state)}
function getCloudSyncMeta(){try{return JSON.parse(localStorage.getItem(cloudSyncMetaKey)||'null')}catch(e){return null}}
function setCloudSyncMeta(remoteUpdatedAt){localStorage.setItem(cloudSyncMetaKey,JSON.stringify({remoteUpdatedAt:remoteUpdatedAt||null,localSnapshot:cloudStateSnapshot(),syncedAt:new Date().toISOString()}))}
function scheduleCloudSync(){if(!navigator.onLine||!cloudConfig().url||!cloudConfig().key)return;clearTimeout(cloudSyncTimer);cloudSyncTimer=setTimeout(()=>automaticCloudSync('push'),1800)}
async function automaticCloudSync(mode='check'){
 if(cloudSyncBusy){cloudSyncAgain=true;return}
 if(!navigator.onLine)return;
 let c,user;
 try{({c,user}=await requireCloudUser())}catch(e){updateCloudStatus();return}
 cloudSyncBusy=true;
 try{
  const q=await c.from('rezende_state').select('payload,updated_at').eq('user_id',user.id).maybeSingle();
  if(q.error)throw q.error;
  const remote=q.data,meta=getCloudSyncMeta(),localNow=cloudStateSnapshot();
  if(!remote){
   if(meta){setCloudSyncMeta(null)}
   const put=await c.from('rezende_state').upsert({user_id:user.id,payload:state,updated_at:new Date().toISOString()},{onConflict:'user_id'});
   if(put.error)throw put.error;
   setCloudSyncMeta(new Date().toISOString());updateCloudStatus();return;
  }
  if(!meta){
   const el=$('#cloudStatus');if(el)el.textContent='● Configurar sincronização inicial';
   return;
  }
  const localUnchanged=meta.localSnapshot===localNow;
  const remoteChanged=!!(remote.updated_at&&meta.remoteUpdatedAt&&new Date(remote.updated_at)>new Date(meta.remoteUpdatedAt));
  if(mode==='pull'||(remoteChanged&&localUnchanged)){
   const p=remote.payload;
   if(!p||!Array.isArray(p.products)||!Array.isArray(p.sales))throw new Error('Dados remotos inválidos; nada foi alterado.');
   state={...structuredClone(defaultState),...p};localStorage.setItem('distribuidoraProV2',JSON.stringify(state));
   setCloudSyncMeta(remote.updated_at);render();updateCloudStatus();return;
  }
  if(remoteChanged&&!localUnchanged){
   const el=$('#cloudStatus');if(el){el.textContent='● Conflito: sincronização pausada';el.style.color='var(--yellow)'}
   toast('Há alterações nos dois aparelhos. Sincronização pausada para proteger seus dados; faça backup antes de resolver.');
   return;
  }
  if(mode==='push'||!remoteChanged){
   const stamp=new Date().toISOString();
   const put=await c.from('rezende_state').upsert({user_id:user.id,payload:state,updated_at:stamp},{onConflict:'user_id'});
   if(put.error)throw put.error;
   setCloudSyncMeta(stamp);updateCloudStatus();
  }
 }catch(e){const el=$('#cloudStatus');if(el)el.textContent='● Sync pendente';console.warn('Sincronização automática:',e.message)}
 finally{cloudSyncBusy=false;if(cloudSyncAgain){cloudSyncAgain=false;scheduleCloudSync()}}
}

let cloudClient=null;
function cloudConfig(){return {url:localStorage.getItem('rz_cloud_url')||'',key:localStorage.getItem('rz_cloud_key')||''}}
function initCloudClient(){const c=cloudConfig();if(!c.url||!c.key){cloudClient=null;return null}if(!window.supabase?.createClient){throw new Error('Biblioteca da nuvem não carregou. Confira a conexão com a internet.')}cloudClient=window.supabase.createClient(c.url,c.key);return cloudClient}
function openCloudPanel(){const c=cloudConfig();openModal('Sincronização entre computador e celular',`<p class="muted">Configure uma única vez em cada dispositivo. Use o mesmo projeto Supabase e a mesma conta de usuário nos dois aparelhos.</p><div class="field"><label>URL do projeto Supabase</label><input id="cloudUrl" value="${esc(c.url)}" placeholder="https://seu-projeto.supabase.co"></div><div class="field"><label>Chave pública anon / publishable</label><input id="cloudKey" value="${esc(c.key)}" placeholder="sb_publishable_... ou chave anon"></div><div class="formactions" style="justify-content:flex-start"><button onclick="saveCloudConfig()">Salvar configuração</button></div><hr style="border-color:#333;margin:18px 0"><div class="field"><label>E-mail da conta</label><input id="cloudEmail" type="email" placeholder="email@exemplo.com" autocomplete="username"></div><div class="field"><label>Senha (mínimo 8 caracteres)</label><input id="cloudPassword" type="password" minlength="8" autocomplete="current-password"></div><div class="actions"><button onclick="cloudSignUp()">Criar conta</button><button class="secondary" onclick="cloudSignIn()">Entrar</button><button class="secondary" onclick="cloudSignOut()">Sair</button></div><hr style="border-color:#333;margin:18px 0"><p class="note">Antes de usar: crie a tabela e as políticas de segurança descritas no arquivo LEIA-ME. O envio substitui a cópia da nuvem pelos dados deste aparelho; o download substitui os dados locais pelos da nuvem. Faça backup antes de sincronizar.</p><div class="actions"><button onclick="cloudPush()">Enviar dados deste aparelho</button><button class="secondary" onclick="cloudPull()">Baixar dados da nuvem</button></div>`);}
function saveCloudConfig(){const url=$('#cloudUrl').value.trim().replace(/\/$/,''),key=$('#cloudKey').value.trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)||!key){toast('Informe a URL do projeto e a chave pública.');return}localStorage.setItem('rz_cloud_url',url);localStorage.setItem('rz_cloud_key',key);try{initCloudClient();toast('Configuração salva neste navegador.');updateCloudStatus()}catch(e){toast(e.message)}}
function cloudCredentials(){const email=$('#cloudEmail')?.value.trim(),password=$('#cloudPassword')?.value;if(!email||!password)throw new Error('Informe e-mail e senha.');if(password.length<8)throw new Error('A senha precisa ter pelo menos 8 caracteres.');return {email,password}}
async function cloudSignUp(){try{const c=initCloudClient();if(!c)throw new Error('Salve primeiro a URL e a chave pública.');const {email,password}=cloudCredentials(),r=await c.auth.signUp({email,password});if(r.error)throw r.error;toast(r.data.session?'Conta criada e conectada.':'Conta criada. Confira seu e-mail se a confirmação estiver ativada.');updateCloudStatus()}catch(e){toast('Erro: '+e.message)}}
async function cloudSignIn(){try{const c=initCloudClient();if(!c)throw new Error('Salve primeiro a URL e a chave pública.');const {email,password}=cloudCredentials(),r=await c.auth.signInWithPassword({email,password});if(r.error)throw r.error;toast('Login realizado.');updateCloudStatus();setTimeout(()=>automaticCloudSync('check'),400)}catch(e){toast('Erro: '+e.message)}}
async function cloudSignOut(){try{const c=initCloudClient();if(!c)throw new Error('Configure a nuvem primeiro.');const r=await c.auth.signOut();if(r.error)throw r.error;toast('Você saiu da conta.');updateCloudStatus()}catch(e){toast('Erro: '+e.message)}}
async function requireCloudUser(){const c=initCloudClient();if(!c)throw new Error('Configure e salve a URL e a chave pública.');const r=await c.auth.getUser();if(r.error||!r.data.user)throw new Error('Entre na conta antes de sincronizar.');return {c,user:r.data.user}}
async function cloudPush(){try{const {c,user}=await requireCloudUser();if(!confirm('Enviar os dados deste aparelho para a nuvem? Isso substituirá a cópia da nuvem. Faça backup antes de continuar.'))return;const r=await c.from('rezende_state').upsert({user_id:user.id,payload:state,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(r.error)throw r.error;setCloudSyncMeta(new Date().toISOString());toast('Dados enviados para a nuvem. Sincronização automática ativada neste aparelho.');updateCloudStatus()}catch(e){toast('Erro ao enviar: '+e.message)}}
async function cloudPull(){try{const {c,user}=await requireCloudUser();if(!confirm('Baixar os dados da nuvem e substituir os dados deste aparelho? Faça backup antes de continuar.'))return;const r=await c.from('rezende_state').select('payload').eq('user_id',user.id).maybeSingle();if(r.error)throw r.error;if(!r.data)throw new Error('Ainda não há dados na nuvem. Primeiro use “Enviar dados deste aparelho” no aparelho que contém os dados corretos.');const p=r.data.payload;if(!p||!Array.isArray(p.products)||!Array.isArray(p.sales))throw new Error('Os dados da nuvem não têm o formato esperado.');state={...structuredClone(defaultState),...p};localStorage.setItem('distribuidoraProV2',JSON.stringify(state));setCloudSyncMeta(r.data.updated_at||new Date().toISOString());toast('Dados baixados. Sincronização automática ativada neste aparelho. Atualizando…');setTimeout(()=>location.reload(),700)}catch(e){toast('Erro ao baixar: '+e.message)}}
async function updateCloudStatus(){const el=$('#cloudStatus');if(!el)return;try{const c=initCloudClient();if(!c){el.textContent='● Nuvem não configurada';return}const r=await c.auth.getUser();el.textContent=r.data?.user?'● Conta conectada':'● Entre na nuvem'}catch(e){el.textContent='● Dados locais'}}
window.addEventListener('load',()=>{updateCloudStatus();setTimeout(()=>automaticCloudSync('check'),1200)});

let installPromptEvent=null;

window.addEventListener('online',()=>{updateNetworkStatus();toast('Internet voltou. Tentando sincronizar automaticamente…');automaticCloudSync('check')});
window.addEventListener('offline',()=>{updateNetworkStatus();toast('Você está offline. As alterações continuam sendo salvas neste aparelho.')});

window.addEventListener('appinstalled',()=>{installPromptEvent=null;const b=$('#installAppBtn');if(b)b.style.display='none';toast('Aplicativo instalado!')});

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
function setPage(page){currentPage=page;$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#sidebar').classList.remove('open');render();}
function pageTitle(p){return ({dashboard:'Painel geral',pdv:'Caixa / PDV',products:'Produtos e estoque',customers:'Clientes',sales:'Histórico de vendas',comandas:'Comandas de consumo',finance:'Financeiro',receivables:'Fiado a receber',expenses:'Despesas',suppliers:'Fornecedores',backup:'Backup e dados'})[p]||'Distribuidora Pro'}
function shell(title,sub,actions=''){return `<div class="pagehead"><div><h1>${title}</h1><p>${sub}</p></div><div class="actions">${actions}</div></div>`}
function cardStat(label,value,foot,icon='◆'){return `<div class="card"><div class="statlabel"><span>${label}</span><span class="staticon">${icon}</span></div><div class="statvalue">${value}</div><div class="statfoot">${foot}</div></div>`}
function table(headers,rows,empty='Nenhum registro encontrado.'){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">${empty}</td></tr>`}</tbody></table></div>`}
function todaySales(){return state.sales.filter(s=>s.date===today())}
function salesTotal(list){return list.filter(s=>s.status!=='cancelada').reduce((a,s)=>a+Number(s.total||0),0)}
function totalExpenses(list=state.expenses){return list.reduce((a,e)=>a+Number(e.amount||0),0)}
function totalCOGS(list=state.sales){return list.filter(s=>s.status!=='cancelada').reduce((a,s)=>a+Number(s.costTotal||0),0)}
function grossProfit(list=state.sales){return salesTotal(list)-totalCOGS(list)}
function isFiadoSale(s){return s?.payment==='Fiado'||s?.saleType==='fiado'||s?.saleType==='parcelado'}
function dueBalance(customerId){return state.sales.filter(s=>s.status!=='cancelada'&&s.customerId===customerId&&isFiadoSale(s)).reduce((a,s)=>a+Math.max(0,Number(s.total||0)-Number(s.paid||0)),0)}
function getCustomer(id){return state.customers.find(c=>c.id===id)}
function getProduct(id){return state.products.find(p=>p.id===id)}
function render(){
 $('#topTitle').textContent=pageTitle(currentPage);$('#today').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
 const content=$('#content');
 const renderers={dashboard:dashboardPage,pdv:pdvPage,comandas:comandasPage,products:productsPage,customers:customersPage,sales:salesPage,finance:financePage,receivables:receivablesPage,expenses:expensesPage,suppliers:suppliersPage,backup:backupPage};
 try{content.innerHTML=(renderers[currentPage]||dashboardPage)()}catch(err){console.error('Erro ao renderizar a tela:',err);content.innerHTML='<section class="card"><h2>Não foi possível carregar esta tela</h2><p>Atualize a página. Se continuar, envie uma foto desta mensagem para o suporte.</p><button onclick="setPage(\'dashboard\')">Voltar ao painel</button></section>'}
 if(currentPage==='pdv'){try{renderCart();setTimeout(()=>{const input=$('#pdvInput');if(input)input.focus()},60)}catch(err){console.error(err)}}
}

 `<div class="card"><h3 class="sectiontitle">Comandas em aberto</h3>${table(['Cliente','Itens','Total','Ações'],rows,'Nenhuma comanda aberta.')}</div>`;

function newComanda(){
 openModal('Nova comanda',`<form onsubmit="createComanda(event)"><div class="field"><label>Nome do cliente *</label><input name="customer" required maxlength="100" placeholder="Nome do cliente"></div><div class="formactions"><button type="button" class="secondary" onclick="closeModal()">Cancelar</button><button>Abrir comanda</button></div></form>`);
}
function createComanda(e){e.preventDefault();const name=new FormData(e.target).get('customer').trim();if(!name)return;const c={id:uid(),customerName:name,items:[],status:'aberta',createdAt:new Date().toISOString(),date:today()};state.comandas.push(c);save();closeModal();render();viewComanda(c.id)}
function viewComanda(id){
 const c=state.comandas.find(x=>x.id===id&&x.status==='aberta');if(!c)return;
 const rows=c.items.map((x,i)=>`<tr><td>${esc(x.name)}</td><td>${x.qty}</td><td>${money(x.price)}</td><td>${money(x.qty*x.price)}</td><td><button class="small danger" onclick="removeComandaItem('${c.id}',${i})">Remover</button></td></tr>`).join('');
 const options=state.products.filter(p=>Number(p.qty)>0).map(p=>`<option value="${p.id}">${esc(p.name)} — ${money(p.price)} (estoque: ${p.qty})</option>`).join('');
 openModal('Comanda — '+esc(c.customerName),`<p class="muted">Adicione cada bebida consumida. O estoque só será baixado quando a conta for fechada.</p><form onsubmit="addComandaItem(event,'${c.id}')"><div class="field"><label>Pesquisar produto</label><input id="comandaProductSearch" type="search" placeholder="Digite o nome ou código de barras" oninput="filterComandaProducts(this.value)"></div><div class="field"><label>Produto</label><select id="comandaProductSelect" name="product" required>${options}</select></div><div class="field"><label>Quantidade</label><input name="qty" type="number" min="1" step="1" value="1" required></div><div class="formactions"><button>Adicionar consumo</button></div></form><h3 class="sectiontitle" style="margin-top:20px">Consumo registrado</h3>${table(['Produto','Qtd.','Unitário','Subtotal',''],rows,'Ainda não há itens nesta comanda.')}<div class="totalrow big"><span>Total</span><span>${money(c.items.reduce((a,x)=>a+Number(x.qty)*Number(x.price),0))}</span></div><p class="note">Feche a conta quando o cliente for pagar.</p><div class="formactions"><button class="secondary" onclick="closeModal()">Voltar</button><button onclick="closeComanda('${c.id}')">Fechar conta</button></div>`);
}
function filterComandaProducts(value){const select=$('#comandaProductSelect');if(!select)return;const q=String(value||'').trim().toLocaleLowerCase('pt-BR');const previous=select.value;const list=state.products.filter(p=>Number(p.qty)>0&&(!q||String(p.name||'').toLocaleLowerCase('pt-BR').includes(q)||String(p.barcode||'').toLocaleLowerCase('pt-BR').includes(q)));select.innerHTML=list.map(p=>`<option value="${p.id}">${esc(p.name)} — ${money(p.price)} (estoque: ${p.qty})</option>`).join('');if(list.some(p=>p.id===previous))select.value=previous;if(!list.length)select.innerHTML='<option value="">Nenhum produto encontrado</option>';}
function addComandaItem(e,id){e.preventDefault();const f=new FormData(e.target),c=state.comandas.find(x=>x.id===id&&x.status==='aberta'),p=getProduct(f.get('product')),qty=Math.floor(Number(f.get('qty')));if(!c||!p||qty<1)return;if(qty>Number(p.qty)){toast('Estoque insuficiente.');return}const item=c.items.find(x=>x.productId===p.id);if(item)item.qty+=qty;else c.items.push({productId:p.id,name:p.name,qty,price:Number(p.price),cost:Number(p.cost||0)});save();viewComanda(id)}
function removeComandaItem(id,index){const c=state.comandas.find(x=>x.id===id&&x.status==='aberta');if(!c)return;c.items.splice(index,1);save();viewComanda(id)}
function closeComanda(id){
 const c=state.comandas.find(x=>x.id===id&&x.status==='aberta');if(!c)return;if(!c.items.length){toast('Adicione pelo menos um produto antes de fechar.');return}
 for(const x of c.items){const p=getProduct(x.productId);if(!p||Number(p.qty)<Number(x.qty)){toast('Estoque insuficiente para '+x.name+'. Atualize a comanda.');return}}
 const total=c.items.reduce((a,x)=>a+Number(x.qty)*Number(x.price),0);
 openModal('Fechar conta — '+esc(c.customerName),`<p>Total da comanda: <strong>${money(total)}</strong></p><form onsubmit="finishComanda(event,'${id}')"><div class="field"><label>Forma de pagamento</label><select name="payment"><option>Dinheiro</option><option>Pix</option><option>Cartão de débito</option><option>Cartão de crédito</option></select></div><div class="field"><label>Valor recebido (R$), se for dinheiro</label><input name="received" type="number" min="0" step=".01" value="${total}"></div><div class="formactions"><button type="button" class="secondary" onclick="closeModal()">Cancelar</button><button>Confirmar pagamento</button></div></form>`);
}
function finishComanda(e,id){e.preventDefault();const c=state.comandas.find(x=>x.id===id&&x.status==='aberta');if(!c)return;const f=new FormData(e.target),payment=f.get('payment'),total=c.items.reduce((a,x)=>a+Number(x.qty)*Number(x.price),0),received=Number(f.get('received')||0);if(payment==='Dinheiro'&&received<0){toast('O valor recebido não pode ser negativo.');return}for(const x of c.items){const p=getProduct(x.productId);if(!p||Number(p.qty)<Number(x.qty)){toast('Estoque insuficiente para '+x.name+'.');return}}
 const sale={id:uid(),number:'V'+String(state.sales.length+1).padStart(5,'0'),date:today(),time:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),customerId:'',customerName:c.customerName,items:c.items.map(x=>({...x})),subtotal:total,discount:0,total,costTotal:c.items.reduce((a,x)=>a+Number(x.cost||0)*Number(x.qty||0),0),payment,saleType:payment==='Dinheiro'&&received<total?'parcelado':'avista',paid:payment==='Dinheiro'?Math.min(received,total):total,received:payment==='Dinheiro'?Math.min(received,total):total,change:payment==='Dinheiro'?Math.max(0,received-total):0,seller:'Comanda',notes:'Comanda de consumo'};
 const before=c.items.map(x=>({id:x.productId,qty:Number(getProduct(x.productId).qty)}));try{c.items.forEach(x=>{const p=getProduct(x.productId);p.qty=Number(p.qty)-Number(x.qty);p.updatedAt=new Date().toISOString()});state.sales.push(sale);c.status='fechada';c.closedAt=new Date().toISOString();c.saleId=sale.id;save()}catch(err){state.sales=state.sales.filter(s=>s.id!==sale.id);before.forEach(x=>{const p=getProduct(x.id);if(p)p.qty=x.qty});c.status='aberta';try{save()}catch(_){}toast('Não foi possível salvar a comanda.');return}closeModal();toast(payment==='Dinheiro'&&received<total?'Conta registrada; saldo de '+money(total-received)+' ficou pendente. Estoque baixado uma única vez.':'Conta fechada, venda registrada e estoque atualizado.');setPage('comandas')}
function cancelComanda(id){const c=state.comandas.find(x=>x.id===id&&x.status==='aberta');if(!c)return;if(!confirm('Cancelar esta comanda? Nenhuma venda será registrada.'))return;state.comandas=state.comandas.filter(x=>x.id!==id);save();render();toast('Comanda cancelada.')}
function dashboardPage(){
 const todays=todaySales(),total=salesTotal(todays),cash=todays.filter(s=>s.payment==='Dinheiro').reduce((a,s)=>a+s.total,0),pix=todays.filter(s=>s.payment==='Pix').reduce((a,s)=>a+s.total,0);
 const low=state.products.filter(p=>Number(p.qty)<=Number(p.minQty??state.settings.lowStock));

 return shell('Caixa / PDV','Frente de caixa integrado ao estoque, clientes e financeiro.',`<button class="secondary" onclick="openCash()">Abertura de caixa</button>`)

function backupPage(){
 return shell('Backup e dados','Exporte seus registros para guardar uma cópia de segurança.')
 +`<div class="grid twocol"><div class="card"><h3 class="sectiontitle">Backup completo</h3><p class="muted">Baixe produtos, clientes, vendas, despesas, fornecedores e recebimentos em um arquivo JSON. Guarde em local seguro.</p><button onclick="backup()">Baixar backup JSON</button><div class="field" style="margin-top:20px"><label>Restaurar backup JSON</label><input type="file" id="restoreFile" accept=".json,application/json"></div><button class="secondary" onclick="restoreBackup()">Restaurar backup</button></div><div class="card"><h3 class="sectiontitle">Estado dos dados</h3>${[['Produtos',state.products.length],['Clientes',state.customers.length],['Vendas',state.sales.length],['Despesas',state.expenses.length],['Fornecedores',state.suppliers.length]].map(([l,n])=>`<div class="totalrow" style="padding:10px 0;border-bottom:1px solid var(--line)"><span class="muted">${l}</span><strong>${n}</strong></div>`).join('')}<p class="note">Os dados locais ficam neste navegador até serem enviados à nuvem. Para compartilhar entre aparelhos, configure a sincronização e use a mesma conta. Faça backups regularmente.</p></div></div>
 <div class="card" style="margin-top:15px"><h3 class="sectiontitle">Configurações</h3><div class="formgrid"><div class="field"><label>Nome da distribuidora</label><input id="settingName" value="${esc(state.settings.businessName)}"></div><div class="field"><label>Alerta padrão de estoque (unidades)</label><input id="settingLow" type="number" min="0" value="${state.settings.lowStock}"></div></div><button onclick="saveSettings()">Salvar configurações</button><p class="note">Não compartilhe este arquivo de backup publicamente: ele pode conter dados de clientes e informações financeiras.</p></div>`;
}
function openModal(title,body){$('#modalTitle').textContent=title;$('#modalbody').innerHTML=body||'';$('#modalback').classList.add('show')}
function closeModal(){$('#modalback').classList.remove('show')}
$('#modalback').addEventListener('click',e=>{if(e.target.id==='modalback')closeModal()});
function productForm(p={}){return `<form onsubmit="saveProduct(event,'${p.id||''}')"><div class="formgrid"><div class="field full"><label>Nome do produto *</label><input name="name" required value="${esc(p.name||'')}" placeholder="Ex.: Refrigerante 2L"></div><div class="field"><label>Código de barras</label><input name="barcode" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(p.barcode||'')}" placeholder="Digite ou cole o código completo" style="width:100%"></div><div class="field"><label>Categoria</label><input name="category" value="${esc(p.category||'')}" placeholder="Bebidas, alimentos..."></div><div class="field"><label>Preço de custo (R$) *</label><input name="cost" type="number" min="0" step=".01" required value="${p.cost??''}"></div><div class="field"><label>Preço de venda (R$) *</label><input name="price" type="number" min="0" step=".01" required value="${p.price??''}"></div><div class="field"><label>Quantidade em estoque *</label><input name="qty" type="number" min="0" step="1" required value="${p.qty??0}"></div><div class="field"><label>Alerta quando chegar a</label><input name="minQty" type="number" min="0" step="1" value="${p.minQty??state.settings.lowStock}"></div></div><div class="formactions"><button type="button" class="secondary" onclick="closeModal()">Cancelar</button><button type="submit">Salvar produto</button></div></form>`}
function openProduct(){openModal('Cadastrar produto',productForm())}
function editProduct(id){const p=getProduct(id);if(p)openModal('Editar produto',productForm(p))}
function saveProduct(e,id){e.preventDefault();const f=new FormData(e.target),barcode=String(f.get('barcode')||'').trim();if(barcode&&state.products.some(p=>p.barcode===barcode&&p.id!==id)){toast('Esse código de barras já está cadastrado.');return}const obj={id:id||uid(),name:f.get('name').trim(),barcode,category:f.get('category').trim(),cost:Number(f.get('cost')),price:Number(f.get('price')),qty:Number(f.get('qty')),minQty:Number(f.get('minQty'))};if(id){const old=getProduct(id);if(old&&old.qty!==obj.qty)old.stockLog=[...(old.stockLog||[]),{date:new Date().toISOString(),before:old.qty,after:obj.qty,reason:'Ajuste manual'}];Object.assign(old,obj)}else state.products.push(obj);save();closeModal();toast('Produto salvo.');render()}
function adjustStock(id){const p=getProduct(id);if(!p)return;openModal('Entrada de estoque',`<form onsubmit="saveStock(event,'${id}')"><p class="muted">Produto: <strong>${esc(p.name)}</strong> • Estoque atual: ${p.qty}</p><div class="field"><label>Quantidade a adicionar</label><input name="qty" type="number" min="1" step="1" required></div><div class="field"><label>Observação</label><input name="reason" placeholder="Ex.: Compra do fornecedor"></div><div class="formactions"><button type="button" class="secondary" onclick="closeModal()">Cancelar</button><button>Registrar entrada</button></div></form>`)}
function saveStock(e,id){e.preventDefault();const p=getProduct(id),f=new FormData(e.target),qty=Number(f.get('qty'));if(!p||qty<=0)return;p.stockLog=[...(p.stockLog||[]),{date:new Date().toISOString(),before:p.qty,after:p.qty+qty,reason:f.get('reason')||'Entrada de estoque'}];p.qty+=qty;save();closeModal();toast('Entrada de estoque registrada.');render()}
function customerForm(c={}){return `<form onsubmit="saveCustomer(event,'${c.id||''}')"><div class="formgrid"><div class="field full"><label>Nome completo / empresa *</label><input name="name" required value="${esc(c.name||'')}"></div><div class="field"><label>Telefone</label><input name="phone" value="${esc(c.phone||'')}"></div><div class="field"><label>CPF / CNPJ (opcional)</label><input name="document" value="${esc(c.document||'')}"></div><div class="field full"><label>Endereço / observações</label><input name="notes" value="${esc(c.notes||'')}"></div></div><div class="formactions"><button type="button" class="secondary" onclick="closeModal()">Cancelar</button><button>Salvar cliente</button></div></form>`}
function openCustomer(){openModal('Novo cliente',customerForm())}
function editCustomer(id){const c=getCustomer(id);if(c)openModal('Editar cliente',customerForm(c))}
function saveCustomer(e,id){e.preventDefault();const f=new FormData(e.target),obj={id:id||uid(),name:f.get('name').trim(),phone:f.get('phone').trim(),document:f.get('document').trim(),notes:f.get('notes').trim()};if(id)Object.assign(getCustomer(id),obj);else state.customers.push(obj);save();closeModal();toast('Cliente salvo.');render()}
function viewCustomer(id){const c=getCustomer(id);if(!c)return;const sales=state.sales.filter(s=>s.customerId===id);openModal('Cliente: '+c.name,`<p><strong>Telefone:</strong> ${esc(c.phone||'—')}<br><strong>Documento:</strong> ${esc(c.document||'—')}<br><strong>Observações:</strong> ${esc(c.notes||'—')}</p><div class="card"><strong>Saldo fiado em aberto: ${money(dueBalance(id))}</strong><p class="muted">${sales.length} venda(s) no histórico.</p></div><div style="margin-top:15px">${table(['Venda','Data','Pagamento','Total','Saldo'],sales.map(s=>`<tr><td>${esc(s.number)}</td><td>${dateBR(s.date)}</td><td>${esc(s.payment)}</td><td>${money(s.total)}</td><td>${money(Math.max(0,s.total-s.paid))}</td></tr>`).join(''),'Nenhuma venda vinculada.')}</div>`)}
function viewSale(id){const s=state.sales.find(x=>x.id===id);if(!s)return;openModal('Venda '+s.number,`<div id="receipt"><div style="text-align:center"><h2>${esc(state.settings.businessName)}</h2><p>CUPOM NÃO FISCAL</p><hr><strong>Venda ${esc(s.number)}</strong><br>${dateBR(s.date)} ${esc(s.time||'')}<br>Cliente: ${esc(s.customerName)}</div><hr>${s.items.map(x=>`<div class="totalrow"><span>${esc(x.name)} (${x.qty} x ${money(x.price)})</span><strong>${money(x.qty*x.price)}</strong></div>`).join('')}<hr>${Number(s.discount||0)>0?`<div class="totalrow"><span>Subtotal</span><span>${money(s.subtotal??(s.total+s.discount))}</span></div><div class="totalrow"><span>Desconto</span><span>− ${money(s.discount)}</span></div>`:''}<div class="totalrow big"><span>TOTAL</span><span>${money(s.total)}</span></div><p>Pagamento: ${esc(s.payment)}</p>${s.payment==='Dinheiro'?`<p>Recebido: ${money(s.received)} • Troco: ${money(s.change)}</p>`:''}${s.payment==='Fiado'?`<p>Saldo em aberto: ${money(s.total-s.paid)}</p>`:''}<p style="text-align:center">Obrigado pela preferência!</p></div><div class="formactions no-print"><button class="secondary" onclick="closeModal()">Fechar</button><button onclick="printReceipt('${s.id}')">Imprimir cupom</button></div>`)}
function printReceipt(id){const s=state.sales.find(x=>x.id===id);if(!s)return;const win=window.open('','_blank','width=420,height=700');if(!win){toast('Permita pop-ups para imprimir o cupom.');return}win.document.write(`<html><head><title>Cupom ${esc(s.number)}</title><style>body{font:13px monospace;padding:18px;color:#000}h2,p{text-align:center}hr{border:0;border-top:1px dashed #555}.row{display:flex;justify-content:space-between;margin:8px 0}.big{font-size:18px;font-weight:bold}</style></head><body><h2>${esc(state.settings.businessName)}</h2><p>CUPOM NÃO FISCAL</p><hr><p>Venda ${esc(s.number)}<br>${dateBR(s.date)} ${esc(s.time||'')}<br>Cliente: ${esc(s.customerName)}</p><hr>${s.items.map(x=>`<div class="row"><span>${esc(x.name)}<br>${x.qty} x ${money(x.price)}</span><b>${money(x.qty*x.price)}</b></div>`).join('')}<hr>${Number(s.discount||0)>0?`<div class="row"><span>Subtotal</span><span>${money(s.subtotal??(s.total+s.discount))}</span></div><div class="row"><span>Desconto</span><span>- ${money(s.discount)}</span></div>`:''}<div class="row big"><span>TOTAL</span><span>${money(s.total)}</span></div><p>Pagamento: ${esc(s.payment)}</p>${s.payment==='Dinheiro'?`<p>Recebido: ${money(s.received)}<br>Troco: ${money(s.change)}</p>`:''}${s.payment==='Fiado'?`<p>Saldo em aberto: ${money(s.total-s.paid)}</p>`:''}<p>Obrigado pela preferência!</p><script>window.onload=()=>window.print()<\/script></body></html>`);win.document.close()}
function receivePayment(id){const s=state.sales.find(s=>s.id===id);if(!s)return;const due=s.total-s.paid;openModal('Receber pagamento',`<p>Cliente: <strong>${esc(s.customerName)}</strong><br>Venda: ${esc(s.number)}<br>Saldo atual: <strong>${money(due)}</strong></p><form onsubmit="saveReceipt(event,'${id}')"><div class="field"><label>Valor recebido (R$)</label><input name="amount" type="number" min=".01" max="${due}" step=".01" required></div><div class="field"><label>Forma de recebimento</label><select name="method"><option>Dinheiro</option><option>Pix</option><option>Cartão de débito</option><option>Cartão de crédito</option></select></div><div class="formactions"><button type="button" class="secondary" onclick="closeModal()">Cancelar</button><button>Confirmar recebimento</button></div></form>`)}
function saveReceipt(e,id){e.preventDefault();const s=state.sales.find(s=>s.id===id),f=new FormData(e.target),amount=Number(f.get('amount'));if(!s||amount<=0||amount>s.total-s.paid){toast('Valor inválido.');return}s.paid+=amount;state.receipts.push({id:uid(),saleId:id,customerId:s.customerId,customerName:s.customerName,amount,method:f.get('method'),date:today()});save();closeModal();toast('Recebimento registrado.');render()}
function expenseForm(e={}){return `<form onsubmit="saveExpense(event,'${e.id||''}')"><div class="formgrid"><div class="field full"><label>Descrição *</label><input name="description" required value="${esc(e.description||'')}" placeholder="Ex.: Energia, frete, aluguel"></div><div class="field"><label>Categoria</label><select name="category">${['Operacional','Frete','Energia','Aluguel','Manutenção','Taxas','Salários','Outros'].map(x=>`<option ${e.category===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Data *</label><input name="date" type="date" required value="${e.date||today()}"></div><div class="field"><label>Forma de pagamento</label><select name="payment">${['Dinheiro','Pix','Cartão de débito','Cartão de crédito','Boleto','Outro'].map(x=>`<option ${e.payment===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Valor (R$) *</label><input name="amount" type="number" min=".01" step=".01" required value="${e.amount??''}"></div></div><div class="formactions"><button type="button" class="secondary" onclick="closeModal()">Cancelar</button><button>Salvar despesa</button></div></form>`}
function openExpense(){openModal('Nova despesa',expenseForm())}
function saveExpense(e,id){e.preventDefault();const f=new FormData(e.target),obj={id:id||uid(),description:f.get('description').trim(),category:f.get('category'),date:f.get('date'),payment:f.get('payment'),amount:Number(f.get('amount'))};if(id)Object.assign(state.expenses.find(x=>x.id===id),obj);else state.expenses.push(obj);save();closeModal();toast('Despesa registrada.');render()}
function deleteExpense(id){if(!confirm('Excluir esta despesa?'))return;state.expenses=state.expenses.filter(e=>e.id!==id);save();render();toast('Despesa excluída.')}
function supplierForm(s={}){return `<form onsubmit="saveSupplier(event,'${s.id||''}')"><div class="formgrid"><div class="field full"><label>Nome do fornecedor *</label><input name="name" required value="${esc(s.name||'')}"></div><div class="field"><label>Telefone</label><input name="phone" value="${esc(s.phone||'')}"></div><div class="field"><label>CPF / CNPJ</label><input name="document" value="${esc(s.document||'')}"></div><div class="field full"><label>Observações</label><input name="notes" value="${esc(s.notes||'')}"></div></div><div class="formactions"><button type="button" class="secondary" onclick="closeModal()">Cancelar</button><button>Salvar fornecedor</button></div></form>`}
function openSupplier(){openModal('Novo fornecedor',supplierForm())}
function editSupplier(id){const s=state.suppliers.find(s=>s.id===id);if(s)openModal('Editar fornecedor',supplierForm(s))}
function saveSupplier(e,id){e.preventDefault();const f=new FormData(e.target),obj={id:id||uid(),name:f.get('name').trim(),phone:f.get('phone').trim(),document:f.get('document').trim(),notes:f.get('notes').trim()};if(id)Object.assign(state.suppliers.find(s=>s.id===id),obj);else state.suppliers.push(obj);save();closeModal();render();toast('Fornecedor salvo.')}
function deleteSupplier(id){if(!confirm('Excluir fornecedor?'))return;state.suppliers=state.suppliers.filter(s=>s.id!==id);save();render()}
function openCash(){openModal('Abertura de caixa',`<p class="muted">Informe o dinheiro que havia no caixa no início do expediente.</p><form onsubmit="saveCash(event)"><div class="field"><label>Valor inicial (R$)</label><input name="opening" type="number" min="0" step=".01" required value="${state.cash.date===today()?state.cash.opening:0}"></div><div class="formactions"><button type="button" class="secondary" onclick="closeModal()">Cancelar</button><button>Salvar abertura</button></div></form>`)}
function saveCash(e){e.preventDefault();const f=new FormData(e.target);state.cash={date:today(),opening:Number(f.get('opening')),closed:false,closing:null};save();closeModal();toast('Abertura de caixa registrada.')}
function backup(){const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'});downloadBlob(blob,'backup-distribuidora-'+today()+'.json')}
function restoreBackup(){const file=$('#restoreFile')?.files[0];if(!file){toast('Selecione um arquivo JSON.');return}const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result),s=data.state||data;if(!s.products||!s.customers||!s.sales)throw new Error();if(!confirm('Restaurar vai substituir os dados atuais deste navegador. Você já fez backup dos dados atuais?'))return;state={...JSON.parse(JSON.stringify(defaultState)),...s};save();toast('Backup restaurado.');render()}catch(e){toast('Arquivo inválido ou incompatível.')}};reader.readAsText(file)}
function saveSettings(){state.settings.businessName=$('#settingName').value.trim()||'Minha Distribuidora';state.settings.lowStock=Math.max(0,Number($('#settingLow').value||0));save();toast('Configurações salvas.');render()}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href)}
function exportCSV(kind){let rows=[],name=kind;const quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';if(kind==='products'){rows=[['Produto','Código','Categoria','Custo','Preço','Quantidade','Alerta'],...state.products.map(p=>[p.name,p.barcode,p.category,p.cost,p.price,p.qty,p.minQty])]}else if(kind==='sales'){rows=[['Venda','Data','Cliente','Pagamento','Subtotal','Desconto','Custo','Total','Pago'],...state.sales.map(s=>[s.number,s.date,s.customerName,s.payment,s.subtotal??(s.total+Number(s.discount||0)),s.discount||0,s.costTotal,s.total,s.paid])]}else{rows=[['Mês','Forma','Quantidade','Total'],...['Dinheiro','Pix','Cartão de débito','Cartão de crédito','Fiado'].map(m=>{const ss=state.sales.filter(s=>s.date.startsWith(today().slice(0,7))&&s.payment===m);return [today().slice(0,7),m,ss.length,salesTotal(ss)]})]}const csv='\ufeff'+rows.map(r=>r.map(quote).join(';')).join('\r\n');downloadBlob(new Blob([csv],{type:'text/csv;charset=utf-8;'}),name+'-'+today()+'.csv')}
function openSaleHelp(){openModal('Ajuda do PDV',`<p><strong>1.</strong> Cadastre os produtos com preço, custo, quantidade e, se possível, código de barras.</p><p><strong>2.</strong> No PDV, clique em um produto ou passe o leitor no campo de busca. Configure o leitor para enviar Enter ao final do código.</p><p><strong>3.</strong> Selecione a forma de pagamento. Para <strong>Fiado</strong>, selecione um cliente cadastrado.</p><p><strong>4.</strong> Clique em Concluir venda. O estoque é baixado e a venda aparece no histórico.</p><p class="note">Esta versão guarda dados somente neste navegador. Faça backup regularmente. O cupom é não fiscal.</p><div class="formactions"><button onclick="closeModal()">Entendi</button></div>`)}
$$('.nav button').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
$('#mobilemenu').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(currentPage==='pdv'&&e.key==='F2'){e.preventDefault();$('#pdvInput')?.focus()}});
render();
</script>
</body>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090909">
<title>Acesso | Rezende Distribuidora</title>
<style>
:root{--red:#f20d20;--white:#f7f7f7;--muted:#aaa}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,Arial,Helvetica,sans-serif}
body{min-height:100vh;display:grid;place-items:center;background:#080808;color:var(--white);padding:32px;overflow-x:hidden;position:relative}
body:before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse at 12% 18%,#4a090b 0,transparent 35%),radial-gradient(ellipse at 90% 80%,#3d080b 0,transparent 30%),linear-gradient(120deg,#050505,#151515 52%,#050505)}
body:after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.35;background:repeating-linear-gradient(125deg,transparent 0 110px,#252525 112px,#080808 160px,transparent 220px)}
.accent{position:fixed;width:230px;height:230px;z-index:-1;pointer-events:none}
.accent.top{top:-115px;left:-95px;background:var(--red);transform:rotate(45deg);box-shadow:0 20px 0 #111}
.accent.bottom{right:-130px;bottom:-140px;background:var(--red);transform:rotate(45deg);width:360px;height:220px}
.card{width:min(100%,690px);position:relative;padding:clamp(28px,5vw,54px);border:1px solid #a50c17;border-radius:28px;background:linear-gradient(145deg,#101010f5,#030303fa 70%);box-shadow:0 0 35px #ed10201c,inset 0 1px 20px #ffffff08;overflow:hidden}
.card:before{content:"";position:absolute;inset:0 0 auto;height:2px;background:linear-gradient(90deg,transparent,var(--red),transparent)}
.brand{text-align:center;margin:0 auto 38px}
.logo{display:block;width:min(100%,245px);height:auto;margin:0 auto 22px;filter:drop-shadow(0 8px 24px #ed102022)}
.brand h1{font-size:clamp(15px,2.4vw,20px);font-weight:500;letter-spacing:.27em;margin:0;text-transform:uppercase}
.brand .sub{font-size:clamp(10px,1.7vw,13px);letter-spacing:.2em;color:#888;margin:16px 0 0;text-transform:uppercase}
.brand .sub span{color:var(--red);padding:0 8px}
.field{margin:0 0 18px}
.wrap{height:72px;display:flex;align-items:center;gap:17px;padding:0 22px;border:1.5px solid #d20e1c;border-radius:17px;background:linear-gradient(110deg,#191919,#101010);box-shadow:inset 0 1px 9px #0008}
.wrap svg{width:27px;height:27px;flex-shrink:0;color:#ddd}
input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:#fff;font-size:19px;padding:16px 0}
input::placeholder{color:#aaa}
.eye{border:0;background:none;color:#ddd;display:grid;place-items:center;padding:4px;cursor:pointer}
.eye svg{width:28px;height:28px}
.options{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:23px 0 32px;font-size:14px}
.remember{display:flex;align-items:center;gap:10px;cursor:pointer}
.remember input{appearance:none;width:20px;height:20px;min-width:20px;padding:0;margin:0;border-radius:5px;border:1px solid #555;background:#151515;cursor:pointer}
.remember input:checked{background:var(--red);border-color:var(--red)}
.remember input:checked:after{content:"✓";display:block;color:#111;font-size:16px;line-height:18px;font-weight:900;text-align:center}
a{color:#f02a37;text-decoration:underline;text-underline-offset:3px;font-size:14px}
.submit{width:100%;min-height:78px;border:0;border-radius:17px;background:linear-gradient(110deg,#ff101d,#ed0014);color:#fff;font-size:clamp(14px,2.3vw,20px);font-weight:850;letter-spacing:.16em;box-shadow:0 10px 35px #f0002033;display:flex;align-items:center;justify-content:center;gap:20px;cursor:pointer}
.submit svg{width:27px;height:27px}
.security{display:flex;align-items:center;justify-content:center;gap:13px;color:#888;font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin:54px 0 0;text-align:center}
.security:before,.security:after{content:"";height:1px;background:#555;flex:1;max-width:75px}
#message{display:none;color:#ff858b;text-align:center;font-size:12px;line-height:1.5;margin:18px 0 0}
@media(max-width:600px){body{padding:16px;min-height:100svh}.card{padding:30px 21px;border-radius:22px}.brand{margin-bottom:30px}.logo{width:min(68%,210px);margin-bottom:19px}.wrap{height:60px;border-radius:13px;padding:0 15px;gap:12px}.wrap svg{width:22px;height:22px}input{font-size:16px}.options{font-size:12px;margin:19px 0 25px}.options a{font-size:12px}.submit{min-height:64px;border-radius:13px;letter-spacing:.1em}.security{margin-top:35px;font-size:9px;gap:8px}.accent.top{width:150px;height:150px;top:-80px;left:-75px}.accent.bottom{width:240px;height:160px;right:-100px;bottom:-100px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="accent top" aria-hidden="true"></div><div class="accent bottom" aria-hidden="true"></div>
<main class="card">
<header class="brand">
<svg class="logo" viewBox="0 0 300 300" role="img" aria-label="Logo Rezende Distribuidora">
<circle cx="150" cy="150" r="139" fill="#030303" stroke="#f20d20" stroke-width="6"/>
<circle cx="150" cy="150" r="127" fill="none" stroke="#f5f5f5" stroke-width="4"/>
<path d="M100 74 L82 46 L117 64 L150 25 L181 64 L217 46 L199 77 L185 83 L115 83 Z" fill="#f20d20"/>
<text x="150" y="151" text-anchor="middle" font-family="Arial,sans-serif" font-size="43" font-weight="900" font-style="italic" fill="#fff" letter-spacing="-2">REZENDE</text>
<path d="M28 161 H272" stroke="#f20d20" stroke-width="2"/>
<rect x="42" y="164" width="216" height="34" fill="#f20d20"/>
<text x="150" y="188" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fff" letter-spacing="2">DISTRIBUIDORA</text>
<path d="M27 211 Q150 232 273 211" stroke="#f5f5f5" stroke-width="3" fill="none"/>
</svg>
<h1>Sistema de Gestão Comercial</h1>
<p class="sub">Estoque <span>|</span> Vendas <span>|</span> Caixa <span>|</span> Comandas</p>
</header>
<form id="loginForm">
<div class="field"><div class="wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg><input id="username" name="username" autocomplete="username" placeholder="Usuário" aria-label="Usuário" required></div></div>
<div class="field"><div class="wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Senha" aria-label="Senha" required><button class="eye" type="button" id="togglePassword" aria-label="Mostrar senha"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
<div class="options"><label class="remember"><input type="checkbox" id="remember"><span>Lembrar meu usuário</span></label><a href="#recuperacao" id="forgotLink">Esqueceu a senha?</a></div>
<button class="submit" type="submit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/></svg>ENTRAR NO SISTEMA</button>
<p id="message" role="status" aria-live="polite"></p>
</form>
<div class="security">♙ Acesso restrito a usuários autorizados</div>
</main>
<script>
const msg=document.getElementById('message');
const user=document.getElementById('username');
if(localStorage.getItem('rezende_login_user')){user.value=localStorage.getItem('rezende_login_user');document.getElementById('remember').checked=true}
document.getElementById('remember').addEventListener('change',e=>{if(e.target.checked&&user.value)localStorage.setItem('rezende_login_user',user.value);else localStorage.removeItem('rezende_login_user')});
user.addEventListener('input',()=>{if(document.getElementById('remember').checked)localStorage.setItem('rezende_login_user',user.value)});
document.getElementById('togglePassword').addEventListener('click',()=>{const p=document.getElementById('password');p.type=p.type==='password'?'text':'password'});
document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();msg.style.display='block';msg.textContent='Esta é uma prévia visual. O login seguro ainda precisa ser conectado e configurado no Supabase.'});
document.getElementById('forgotLink').addEventListener('click',e=>{e.preventDefault();msg.style.display='block';msg.textContent='A recuperação de senha será ativada quando a autenticação segura for configurada.'});
</script>
</body>
</html>

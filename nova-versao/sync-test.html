<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teste seguro de sincronização</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#0b0b0d;color:#f5f5f7;font:16px Arial,sans-serif;padding:22px}.card{max-width:620px;margin:20px auto;background:#17171b;border:1px solid #333;border-radius:16px;padding:22px}input,button{box-sizing:border-box;width:100%;padding:13px;margin:7px 0;border-radius:8px;border:1px solid #444;background:#0f0f12;color:#fff}button{background:#e32636;border:0;font-weight:bold}small{color:#aaa}.ok{color:#65d69a}.warn{color:#ffd166}.stat{display:inline-block;margin:8px 14px 8px 0;font-size:24px}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#ddd}</style></head><body><main class="card"><h2>Teste seguro — Distribuidora Rezende</h2><p>Esta página é somente de leitura: não envia, altera nem apaga dados no banco.</p><label>E-mail da conta Supabase</label><input id="email" type="email" autocomplete="username" placeholder="E-mail usado no sistema"><label>Senha da conta Supabase</label><input id="password" type="password" autocomplete="current-password" placeholder="Senha"><button id="check">Entrar e conferir dados da nuvem</button><div id="result" role="status"><small>Vamos conferir quantos produtos, vendas e comandas essa conta consegue enxergar.</small></div></main><script>
const result=document.getElementById('result');document.getElementById('check').addEventListener('click',async()=>{const btn=document.getElementById('check');btn.disabled=true;result.textContent='Conferindo…';try{const url=localStorage.getItem('rz_cloud_url')||'',key=localStorage.getItem('rz_cloud_key')||'';if(!url||!key)throw new Error('Este navegador não tem a URL e a chave pública salvas. Abra o sistema atual neste mesmo navegador e confira a configuração da nuvem.');if(!window.supabase?.createClient)throw new Error('A biblioteca do Supabase não carregou. Confira a conexão.');const client=window.supabase.createClient(url,key);const {data:auth,error:authError}=await client.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(authError)throw authError;if(!auth.user)throw new Error('A conta não foi confirmada pelo Supabase.');const {data,error}=await client.from('rezende_state').select('payload,updated_at').eq('user_id',auth.user.id).maybeSingle();if(error)throw error;if(!data)throw new Error('O login funcionou, mas esta conta não encontrou um registro próprio em rezende_state. Não alterei nada.');const p=data.payload||{};result.innerHTML='<h3 class="ok">Conexão confirmada — consulta somente de leitura</h3><p>Última atualização da nuvem: '+new Date(data.updated_at).toLocaleString('pt-BR')+'</p><div class="stat">'+(p.products?.length??'—')+'<br><small>Produtos</small></div><div class="stat">'+(p.sales?.length??'—')+'<br><small>Vendas</small></div><div class="stat">'+(p.comandas?.length??'—')+'<br><small>Comandas</small></div><p>Essa conta consegue ler o registro da nuvem. Nenhum dado foi enviado ou substituído.</p><button id="export">Baixar cópia JSON da nuvem</button><p class="warn"><small>Guarde o arquivo em local privado; ele pode conter informações comerciais e de clientes.</small></p>';document.getElementById('export').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(p,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup-rezende-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)});}catch(e){result.innerHTML='<p class="warn">'+String(e.message||e)+'</p><p><small>Esta página não modifica o banco. Se aparecer erro, envie uma captura escondendo e-mail e qualquer dado sensível.</small></p>';}finally{btn.disabled=false}});</script></body></html>
